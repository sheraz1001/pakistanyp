    <style id="critical-css">
      /* SSR first paint only. A lower-priority layer lets the complete,
         unlayered Tailwind stylesheet take over without specificity conflicts. */
      @layer pakistanyp-critical {
        :root {
          --background: #FAF8F3; --foreground: #0A0A0A; --card: #FFFFFF; --border: #E7E9EE;
          --muted-foreground: #5B6475; --yp-green: #0B6B2E; --yp-green-dark: #05501F; --yp-red: #D71920;

          --font-heading: var(--font-body);
          --font-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
        }
        *, ::before, ::after { box-sizing: border-box; border: 0 solid var(--border); }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; background: #FAF8F3; }
        html, body, #root { min-height: 100dvh; }
        html, body { overflow-x: clip; }
        body { margin: 0; background: #FAF8F3; color: #0A0A0A; font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }

        h1, h2, h3, h4 { font-size: inherit; font-weight: inherit; letter-spacing: -.025em; text-wrap: balance; }
        a { color: inherit; text-decoration: inherit; }
        button, input, select { font: inherit; color: inherit; margin: 0; }
        button { background: transparent; cursor: pointer; }
        img, svg { display: block; vertical-align: middle; }
        img { max-width: 100%; height: auto; }
        .hidden { display: none; } .flex { display: flex; } .inline-flex { display: inline-flex; }
        .items-center { align-items: center; } .shrink-0 { flex-shrink: 0; } .ml-auto { margin-left: auto; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border-width: 0; }

        .site-nav a { display: inline-flex; align-items: center; padding: .625rem .75rem; border-radius: 10px; font-size: .875rem; font-weight: 500; color: #3A4354; white-space: nowrap; }

    <!-- Service worker cleanup script -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((cacheNames) => {
          cacheNames.forEach(cacheName => {
            caches.delete(cacheName);
          });
        });
      }
